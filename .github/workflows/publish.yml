name: Publish

# npm Trusted Publishing (OIDC) + Sigstore build attestations for the
# mcp-rce-guard package. Fires on tag push (semver vX.Y.Z); also exposed as
# workflow_dispatch so a release can be re-triggered without re-tagging.
#
# Trusted Publishing setup (one-time, npm registry side):
#   1. Owner runs `npm access` to enable the `Trusted Publisher` policy on
#      the `mcp-rce-guard` package.
#   2. Owner adds this repo (studiomeyer-io/mcp-rce-guard) + this workflow
#      file path (.github/workflows/publish.yml) + `release` environment
#      as the trusted publisher.
# After that, `npm publish --provenance` succeeds without an `NPM_TOKEN`
# secret. The OIDC token minted by `permissions: id-token: write` carries
# the GitHub Actions identity that npm verifies against the trusted-publisher
# policy.
#
# Build attestation (Sigstore): `actions/attest-build-provenance` records a
# signed in-toto SLSA Level-3 attestation of the `dist/` artefacts in the
# repo's transparency log. Consumers can verify with `gh attestation verify`
# or `cosign verify-blob-attestation`.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish (e.g. v0.1.0)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write       # required for OIDC trusted publishing + provenance
      attestations: write   # required for actions/attest-build-provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Type-check
        run: npx tsc -p tsconfig.build.json --noEmit
      - name: Build dist/
        run: npm run build
      - name: Test
        run: npm test
      - name: MCP-Inspector tools/list smoke
        run: |
          timeout 60s npx -y @modelcontextprotocol/inspector --cli \
            node dist/server.js --method tools/list
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/**/*.js
            dist/**/*.d.ts
      - name: Skip if this version is already on npm
        id: npmcheck
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VER liegt bereits auf npm - Publish wird uebersprungen"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm (Trusted Publishing OIDC, --provenance)
        if: steps.npmcheck.outputs.already == 'false'
        # No NPM_TOKEN is set. `--provenance` produces an npm-side provenance
        # statement that is cross-verified by the trusted-publisher policy.
        run: npm publish --provenance --access public
