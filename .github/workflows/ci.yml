name: CI

on:
  push:
    branches: [main, builder/**]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20.x, 22.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.build.json --noEmit
      - run: npm run build
      - run: npm test

  # MCP-Spec smoke (Plan §Test-Plan): Inspector tool-list roundtrip +
  # mcp-protocol-validator green. ubuntu-only to keep CI matrix lean; the
  # underlying server is stdio + cross-platform so one OS is enough.
  protocol-conformance:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      # MCP-Inspector: list tools via the spawn-fertige server entry.
      # `--cli` mode runs the inspector headless and exits non-zero on probe
      # failure.
      #
      # Das Herunterladen des Inspectors ist ein eigener Schritt, weil die
      # Zeitgrenze darunter einen HAENGENDEN SERVER fangen soll und sonst den
      # npx-Download mitmisst. Genau daran ist dieser Schritt am 04.09.2026
      # zweimal gescheitert (Exit 124), waehrend alle vier Test-Matrixbeine
      # gruen waren: die 60 s galten fuer Download plus Aufruf zusammen.
      - name: MCP-Inspector holen
        # Laedt den Inspector in den npx-Cache. Der Rueckgabewert ist egal:
        # der Schritt soll nur den Download aus der Zeitmessung darunter
        # heraushalten, nicht selbst etwas pruefen.
        run: npx -y @modelcontextprotocol/inspector --version || true
      - name: MCP-Inspector tools/list smoke
        run: |
          timeout 60s npx -y @modelcontextprotocol/inspector --cli \
            node dist/server.js --method tools/list
      # mcp-protocol-validator: full MCP 2025-06-18 spec conformance run.
      # Marked continue-on-error in v0.1 because upstream is still
      # stabilising; surfaces issues as CI annotations without blocking.
      - name: mcp-protocol-validator
        continue-on-error: true
        run: |
          timeout 120s npx -y mcp-protocol-validator \
            --command "node dist/server.js" \
            --spec 2025-06-18 || true
